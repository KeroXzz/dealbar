name: probe-mydealz
on:
  push:
    branches: [claude/project-thread-psty7v]
    paths: [.github/workflows/probe.yml, programm/vorschlaege.py]
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r programm/requirements.txt
      - run: python programm/vorschlaege.py
