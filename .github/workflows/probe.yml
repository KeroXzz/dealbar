name: probe-mydealz
on:
  push:
    branches: [claude/project-thread-psty7v]
    paths: [.github/workflows/probe.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in hot neu "gruppe/haushalt" "gruppe/kuche"; do
            echo "=== $f"; curl -sS -m 20 -A "Mozilla/5.0 (compatible; dealbar/1.0)" -w "\nHTTP %{http_code}\n" "https://www.mydealz.de/rss/$f" -o out.xml; head -c 200 out.xml; echo; grep -c "<item>" out.xml || true
          done
          curl -sS -m 20 -A "Mozilla/5.0 (compatible; dealbar/1.0)" "https://www.mydealz.de/rss/hot" -o hot.xml
          python3 - <<'PY'
          s=open("hot.xml",encoding="utf-8",errors="replace").read()
          items=s.split("<item>")
          print(items[0][:1500])
          for it in items[1:3]: print("----ITEM----"); print(it[:2500])
          am=[it for it in items[1:] if "amazon" in it.lower()]
          print("AMAZON ITEMS", len(am))
          if am: print(am[0][:3000])
          PY
          L=$(python3 -c "
          import re;s=open('hot.xml').read()
          for it in s.split('<item>')[1:]:
              if 'Amazon' in it:
                  print(re.search(r'<link>(.*?)</link>',it).group(1));break")
          echo "LINK $L"
          ID=$(echo "$L" | grep -oE '[0-9]+$'); echo ID $ID
          for u in "https://www.mydealz.de/visit/thread/$ID" "https://www.mydealz.de/visit/threadmain/$ID"; do
            echo "== $u"; curl -sS -m 20 -A "Mozilla/5.0 (compatible; dealbar/1.0)" -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "$u"
          done
