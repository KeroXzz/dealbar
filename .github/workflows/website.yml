name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TZ: Europe/Berlin
  PYTHONIOENCODING: utf-8

jobs:
  website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: programm/requirements.txt
      - run: pip install -r programm/requirements.txt
      - run: python programm/website.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
