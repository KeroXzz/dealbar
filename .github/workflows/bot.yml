name: Telegram-Bot

# Laeuft fast durchgehend: jeder Lauf wartet bis zu ~5,7 Stunden auf Nachrichten,
# der naechste (stuendlich eingeplant) steht schon in der Warteschlange.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

env:
  TZ: Europe/Berlin
  PYTHONIOENCODING: utf-8
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
  PARTNER_TAG: ${{ vars.PARTNER_TAG }}
  MAX_MINUTES: "340"

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: programm/requirements.txt
      - run: pip install -r programm/requirements.txt
      - name: Auf Deals warten
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dealbar-bot"
          git config user.email "dealbar-bot@users.noreply.github.com"
          python programm/telegram_bot.py lauschen
