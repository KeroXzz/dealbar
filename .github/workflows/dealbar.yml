name: dealbar

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten neue Telegram-Nachrichten abholen
  workflow_dispatch:          # manuell starten: Actions > dealbar > Run workflow
  push:
    branches: [main]
    paths-ignore: ["programm/telegram_status.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dealbar
  cancel-in-progress: false

env:
  TZ: Europe/Berlin
  PYTHONIOENCODING: utf-8
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
  PARTNER_TAG: ${{ vars.PARTNER_TAG }}

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: programm/requirements.txt

      - run: pip install -r programm/requirements.txt

      - name: Neue Deals aus Telegram holen
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: python programm/telegram_bot.py eingang

      - name: Videos rendern
        run: python programm/run.py

      - name: Videos per Telegram zurückschicken
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: python programm/telegram_bot.py ausgang

      - name: Website bauen
        run: python programm/website.py

      - name: Änderungen speichern
        run: |
          git config user.name "dealbar-bot"
          git config user.email "dealbar-bot@users.noreply.github.com"
          git add -A deals deals.xlsx programm/telegram_status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "Neue Deals aus Telegram"
            git push
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: env.changed == 'true' || github.event_name != 'schedule'
        with:
          path: website

      - id: deploy
        if: env.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
